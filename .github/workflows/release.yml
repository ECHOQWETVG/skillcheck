name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine pytest
          python -m build
          python -m twine check dist/*
          python -m pip install dist/*.whl
          python -m pytest -q
          skillcheck test examples/hello-skill --strict
      - name: Check tag matches package version
        run: |
          python - <<'PY'
          import os
          from skillcheck import __version__
          assert os.environ['GITHUB_REF_NAME'] == f'v{__version__}', 'Tag and package version differ'
          PY
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft --prerelease --title "SkillCheck $GITHUB_REF_NAME (Alpha)" --notes-file CHANGELOG.md
