name: Package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install
        run: |
          python -m pip install --upgrade pip build twine pytest
          python -m build
          python -m twine check dist/*
          python -m pip install dist/*.whl
      - name: Run regression tests against installed wheel
        run: python -m pytest -q
      - name: Run installed CLI
        run: |
          skillcheck --version
          skillcheck lint examples/hello-skill --strict
          skillcheck test examples/hello-skill --strict
